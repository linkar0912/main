services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: replyconnect
      POSTGRES_PASSWORD: replyconnect
      POSTGRES_DB: replyconnect
    ports:
      - "5432:5432"
    volumes:
      - replyconnect-postgres:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - replyconnect-redis:/data

volumes:
  replyconnect-postgres:
  replyconnect-redis:
