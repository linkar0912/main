services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dmsetu
      POSTGRES_PASSWORD: dmsetu
      POSTGRES_DB: dmsetu
    ports:
      - "5432:5432"
    volumes:
      - dmsetu-postgres:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - dmsetu-redis:/data

volumes:
  dmsetu-postgres:
  dmsetu-redis:
