name: Build production container

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: linkar-container-main
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm build

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/linkar0912/main
          tags: |
            type=raw,value=main
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy verified image to Dokploy
        if: github.ref == 'refs/heads/main'
        env:
          DEPLOY_HOST: ${{ secrets.DOKPLOY_DEPLOY_HOST }}
          DEPLOY_KEY: ${{ secrets.DOKPLOY_DEPLOY_KEY }}
          DEPLOY_HOST_KEY: ${{ secrets.DOKPLOY_DEPLOY_HOST_KEY }}
        run: |
          set -euo pipefail
          key=$(mktemp)
          known_hosts=$(mktemp)
          trap 'rm -f "$key" "$known_hosts"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          printf '%s\n' "$DEPLOY_HOST_KEY" > "$known_hosts"
          chmod 600 "$key" "$known_hosts"
          ssh -i "$key" -o IdentitiesOnly=yes -o UserKnownHostsFile="$known_hosts" \
            deploybot@"$DEPLOY_HOST" "deploy $GITHUB_SHA"
