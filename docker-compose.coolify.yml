name: replyconnect

x-application-environment: &application-environment
  NODE_ENV: production
  APP_NAME: ${APP_NAME:-ReplyConnect}
  NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL is required}
  SUPPORT_EMAIL: ${SUPPORT_EMAIL:?SUPPORT_EMAIL is required}
  SOURCE_COMMIT: ${SOURCE_COMMIT:-main}
  OWNER_EMAIL: ${OWNER_EMAIL:?OWNER_EMAIL is required}
  OWNER_PASSWORD_HASH: ${OWNER_PASSWORD_HASH:?OWNER_PASSWORD_HASH is required}
  OWNER_SESSION_SECRET: ${OWNER_SESSION_SECRET:?OWNER_SESSION_SECRET is required}
  OWNER_WORKSPACE_ID: ${OWNER_WORKSPACE_ID:-replyconnect_owner_workspace}
  DATABASE_URL: postgresql://${POSTGRES_USER:-replyconnect}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-replyconnect}?schema=public
  REDIS_URL: redis://:${VALKEY_PASSWORD:?VALKEY_PASSWORD is required}@valkey:6379/0
  META_APP_ID: ${META_APP_ID:-}
  META_APP_SECRET: ${META_APP_SECRET:-}
  META_TOKEN_ENCRYPTION_KEY: ${META_TOKEN_ENCRYPTION_KEY:?META_TOKEN_ENCRYPTION_KEY is required}
  META_REDIRECT_URI: ${META_REDIRECT_URI:?META_REDIRECT_URI is required}
  META_VERIFY_TOKEN: ${META_VERIFY_TOKEN:?META_VERIFY_TOKEN is required}
  META_API_VERSION: ${META_API_VERSION:-v25.0}
  META_SCOPES: ${META_SCOPES:-instagram_business_basic,instagram_business_manage_comments,instagram_business_manage_messages}

services:
  migrate:
    image: ghcr.io/tejastelkar/replyconnect:${REPLYCONNECT_IMAGE_TAG:-main}
    pull_policy: always
    command: ["pnpm", "db:migrate:deploy"]
    restart: "no"
    exclude_from_hc: true
    environment: *application-environment
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  web:
    image: ghcr.io/tejastelkar/replyconnect:${REPLYCONNECT_IMAGE_TAG:-main}
    pull_policy: always
    command: ["pnpm", "start"]
    restart: unless-stopped
    environment: *application-environment
    expose:
      - "3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.35"
          memory: 384M

  worker:
    image: ghcr.io/tejastelkar/replyconnect:${REPLYCONNECT_IMAGE_TAG:-main}
    pull_policy: always
    command: ["pnpm", "worker"]
    restart: unless-stopped
    environment: *application-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: 256M

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-replyconnect}
      POSTGRES_USER: ${POSTGRES_USER:-replyconnect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - replyconnect-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 384M

  valkey:
    image: valkey/valkey:9.1.1-alpine3.24
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes", "--appendfsync", "everysec", "--protected-mode", "yes", "--requirepass", "${VALKEY_PASSWORD:?VALKEY_PASSWORD is required}"]
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?VALKEY_PASSWORD is required}
    volumes:
      - replyconnect-valkey:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli --no-auth-warning -a \"$$VALKEY_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 128M

volumes:
  replyconnect-postgres:
  replyconnect-valkey:
