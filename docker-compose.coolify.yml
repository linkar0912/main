name: linkar
# Postgres and Auth are hosted on Supabase (not run in this stack). DATABASE_URL
# is Supabase's transaction pooler (port 6543, ?pgbouncer=true required - Prisma's
# prepared statements otherwise break under PgBouncer transaction mode).
# migrate needs DIRECT_URL instead: `prisma migrate deploy` takes a Postgres
# advisory lock, which the transaction pooler does not support - use Supabase's
# direct connection (port 5432) or session-mode pooler for that one service only.
x-application-environment: &application-environment
  NODE_ENV: production
  APP_NAME: ${APP_NAME:-Linkar}
  APP_URL: ${APP_URL:?APP_URL is required}
  NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL is required}
  PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://linkar.in}
  SUPPORT_EMAIL: ${SUPPORT_EMAIL:?SUPPORT_EMAIL is required}
  # Fallback only - /api/health prefers BUILD_COMMIT, which is baked into the
  # image at build time and cannot drift from the running build.
  SOURCE_COMMIT: ${SOURCE_COMMIT:-main}
  WORKER_HEALTH_PORT: ${WORKER_HEALTH_PORT:-3001}
  AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:?AUTH_SESSION_SECRET is required}
  PLATFORM_OWNER_USER_IDS: ${PLATFORM_OWNER_USER_IDS:?PLATFORM_OWNER_USER_IDS is required}
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  REDIS_URL: redis://:${VALKEY_PASSWORD:?VALKEY_PASSWORD is required}@valkey:6379/0
  # Both channels are part of the App Review submission, so a missing app id or
  # secret is a broken deployment, not a degraded one. Without these guards the
  # stack booted clean and only failed later as a `?meta=missing-config`
  # redirect that nothing was watching.
  META_APP_ID: ${META_APP_ID:?META_APP_ID is required}
  META_APP_SECRET: ${META_APP_SECRET:?META_APP_SECRET is required}
  META_TOKEN_ENCRYPTION_KEY: ${META_TOKEN_ENCRYPTION_KEY:?META_TOKEN_ENCRYPTION_KEY is required}
  META_REDIRECT_URI: ${META_REDIRECT_URI:?META_REDIRECT_URI is required}
  META_VERIFY_TOKEN: ${META_VERIFY_TOKEN:?META_VERIFY_TOKEN is required}
  META_API_VERSION: ${META_API_VERSION:-v25.0}
  META_SCOPES: ${META_SCOPES:-instagram_business_basic,instagram_business_manage_comments,instagram_business_manage_messages}
  FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:?FACEBOOK_APP_ID is required}
  FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:?FACEBOOK_APP_SECRET is required}
  FACEBOOK_REDIRECT_URI: ${FACEBOOK_REDIRECT_URI:-https://app.linkar.in/api/facebook/oauth/callback}
  FACEBOOK_VERIFY_TOKEN: ${FACEBOOK_VERIFY_TOKEN:?FACEBOOK_VERIFY_TOKEN is required}
  FACEBOOK_API_VERSION: ${FACEBOOK_API_VERSION:-v25.0}
  FACEBOOK_SCOPES: ${FACEBOOK_SCOPES:-pages_show_list,pages_manage_engagement,pages_manage_metadata,pages_read_engagement,pages_read_user_content}
  FACEBOOK_TOKEN_ENCRYPTION_KEY: ${FACEBOOK_TOKEN_ENCRYPTION_KEY:-}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-https://app.linkar.in/api/auth/oauth/google/callback}
  FOLLOW_GATED_CAMPAIGNS_ENABLED: ${FOLLOW_GATED_CAMPAIGNS_ENABLED:-false}
  TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
  DISPATCH_LEASE_MS: ${DISPATCH_LEASE_MS:-30000}
  ADMIN_CHALLENGE_TTL_SECONDS: ${ADMIN_CHALLENGE_TTL_SECONDS:-600}
  DELETION_JOB_ATTEMPTS: ${DELETION_JOB_ATTEMPTS:-8}
  DELETION_JOB_BACKOFF_MS: ${DELETION_JOB_BACKOFF_MS:-5000}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?NEXT_PUBLIC_SUPABASE_URL is required}
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:?NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY is required}
  SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?SUPABASE_SERVICE_ROLE_KEY is required}
services:
  migrate:
    image: ghcr.io/linkar0912/main:${LINKAR_IMAGE_TAG:-main}
    pull_policy: always
    command: ["./node_modules/.bin/prisma", "migrate", "deploy"]
    restart: "no"
    exclude_from_hc: true
    environment:
      <<: *application-environment
      DATABASE_URL: ${DIRECT_URL:?DIRECT_URL is required}
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
  web:
    image: ghcr.io/linkar0912/main:${LINKAR_IMAGE_TAG:-main}
    pull_policy: always
    command: ["./node_modules/.bin/next", "start"]
    restart: unless-stopped
    environment:
      <<: *application-environment
      WORKER_HEALTH_URL: http://worker:3001/health
    expose:
      - "3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.35"
          memory: 384M
  worker:
    image: ghcr.io/linkar0912/main:${LINKAR_IMAGE_TAG:-main}
    pull_policy: always
    command: ["node", "dist/worker.js"]
    restart: unless-stopped
    environment: *application-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    # Without this the orchestrator reported the worker as running:unknown - up,
    # but with nothing confirming it could still reach Redis and PostgreSQL.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.WORKER_HEALTH_PORT || 3001) + '/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: 256M
  valkey:
    image: valkey/valkey:9.1.1-alpine3.24
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes", "--appendfsync", "everysec", "--protected-mode", "yes", "--requirepass", "${VALKEY_PASSWORD:?VALKEY_PASSWORD is required}"]
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?VALKEY_PASSWORD is required}
    volumes:
      - linkar-valkey:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli --no-auth-warning -a \"$$VALKEY_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 128M
volumes:
  linkar-valkey:
